<!DOCTYPE html>
<html>
<head>
    <title>Heart Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
  body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: black;
}

.heart {
    font-size: 100px;
    color: red;
    animation: heartbeat 1s infinite;
}

@keyframes heartbeat {
    0% {
        transform: scale(1);
    }

    25% {
        transform: scale(1.2);
    }

    40% {
        transform: scale(1);
    }

    60% {
        transform: scale(1.2);
    }

    100% {
        transform: scale(1);
    }
}
.heart {
    font-size: 100px;
    color: red;
    text-shadow: 0 0 10px red,
                 0 0 30px red,
                 0 0 60px red;
    animation: heartbeat 1s infinite;
}
</style>
<body>

    <div class="heart">♥</div>

</body>
</html>
