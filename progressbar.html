<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyFrames</title>
</head>
<style>
    
    .container {
    width: 400px;
    margin: auto;
    border: 2px solid navy;
    }

    .square {
    width: 20px;
    height: 20px;
    background: red;
    position: relative;
    animation: loading 4s 1 forwards;
    }


@keyframes loading{
    0%{
        width: 0%;
    }

    100%{
        width: 100%;
    }
}
.load {
    width: 400px;
    margin: auto;
    }
</style>

<body>
    <div class="container">
        <div class="square"></div>
    </div>
    <div class="load">Loading...</div>
</body>
</html>
