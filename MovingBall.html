<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moving Ball</title>

    <style>
        body {
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            width: 600px;
            height: 400px;
            border: 3px solid white;
            position: relative;
            overflow: hidden;
        }

        .ball {
            width: 50px;
            height: 50px;
            background-color: red;
            border-radius: 50%;
            position: absolute;

            animation: moveBall 4s linear infinite;
        }

        @keyframes moveBall {

            0% {
                left: 0;
                top: 0;
            }

            25% {
                left: 550px;
                top: 0;
            }

            50% {
                left: 550px;
                top: 350px;
            }

            75% {
                left: 0;
                top: 350px;
            }

            100% {
                left: 0;
                top: 0;
            }
        }
    </style>
</head>

<body>

    <div class="box">
        <div class="ball"></div>
    </div>

</body>
</html>
