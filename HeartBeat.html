<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Beat Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0b0b0b;
}

.heart {
    font-size: 120px;
    color: red;

    text-shadow:
        0 0 10px red,
        0 0 30px red,
        0 0 60px red;

    animation: heartbeat 1s infinite;
}

@keyframes heartbeat {

    0% {
        transform: scale(1);
    }

    20% {
        transform: scale(1.25);
    }

    40% {
        transform: scale(1);
    }

    60% {
        transform: scale(1.25);
    }

    100% {
        transform: scale(1);
    }
}
</style>


<body>

    <div class="heart">♥</div>

</body>
</html>
