<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainbow Loader</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0b0b0b;
}

/* Rainbow Loader */
.loader {
    width: 120px;
    height: 120px;
    border-radius: 50%;

    background: conic-gradient(
        red,
        orange,
        yellow,
        lime,
        cyan,
        blue,
        violet,
        red
    );

    animation: spin 1.5s linear infinite;

    /* Glow */
    box-shadow:
        0 0 15px red,
        0 0 30px cyan,
        0 0 45px violet;

    position: relative;
}

/* Create the center hole */
.loader::before {
    content: "";
    position: absolute;

    width: 85px;
    height: 85px;

    background: #0b0b0b;
    border-radius: 50%;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);
}

/* Rotation */
@keyframes spin {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}
</style>
<body>

    <div class="loader"></div>

</body>
</html>
