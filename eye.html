<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Eye</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #050505;
}

/* Eye */

.eye {
    width: 350px;
    height: 180px;

    background: white;

    border-radius: 70% 10% 70% 10%;

    transform: rotate(45deg);

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;

    box-shadow:
        0 0 20px #00e5ff,
        0 0 50px #00e5ff;

    animation: blink 4s infinite;
}

/* Iris */

.iris {
    width: 120px;
    height: 120px;

    background: radial-gradient(
        circle,
        #000 15%,
        #00e5ff 16%,
        #0066ff 55%,
        #001b44 100%
    );

    border-radius: 50%;

    display: flex;
    justify-content: center;
    align-items: center;

    animation: look 3s ease-in-out infinite;

    box-shadow: 0 0 30px #00e5ff;
}

/* Pupil */

.pupil {
    width: 45px;
    height: 45px;

    background: black;

    border-radius: 50%;

    box-shadow: 0 0 10px black;
}

/* Pupil movement */

@keyframes look {

    0% {
        transform: translateX(-25px);
    }

    25% {
        transform: translateX(25px);
    }

    50% {
        transform: translateY(20px);
    }

    75% {
        transform: translate(-20px, -15px);
    }

    100% {
        transform: translateX(-25px);
    }

}

/* Blink */

@keyframes blink {

    0%, 90%, 100% {
        transform: rotate(45deg) scaleY(1);
    }

    93%, 97% {
        transform: rotate(45deg) scaleY(0.05);
    }

}
</style>
<body>

    <div class="eye">

        <div class="iris">
            <div class="pupil"></div>
        </div>

    </div>

</body>
</html>
