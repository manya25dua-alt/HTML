<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0b0b0b;
}

.typing {
    color: white;
    font-family: monospace;
    font-size: 35px;

    width: 0;
    overflow: hidden;
    white-space: nowrap;

    border-right: 3px solid white;

    animation:
        typing 4s steps(25) forwards,
        cursor 0.7s infinite;
}

@keyframes typing {
    from {
        width: 0;
    }

    to {
        width: 25ch;
    }
}

@keyframes cursor {
    50% {
        border-color: transparent;
    }
}
</style>

<body>


    <div class="typing">
        Hello, I'm learning CSS!
    </div>

</body>
</html>
