<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Galaxy</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #02010a;
}

/* Galaxy */
.galaxy {
    position: relative;

    width: 500px;
    height: 500px;

    border-radius: 50%;

    animation: rotateGalaxy 15s linear infinite;

    background:
        radial-gradient(
            ellipse at center,
            #ffffff 0%,
            #b58cff 5%,
            #6a35a8 15%,
            transparent 45%
        );
}

/* Galaxy arms */
.galaxy::before,
.galaxy::after {
    content: "";

    position: absolute;

    width: 500px;
    height: 180px;

    top: 160px;
    left: 0;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            rgba(160, 80, 255, 0.7),
            transparent 65%
        );

    transform: rotate(25deg);
}

.galaxy::after {
    transform: rotate(-25deg);
}

/* Bright center */
.core {
    position: absolute;

    width: 100px;
    height: 100px;

    top: 200px;
    left: 200px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 20px white,
        0 0 50px #b56cff,
        0 0 100px #7a2cff;
}

/* Stars */
.star {
    position: absolute;

    width: 5px;
    height: 5px;

    background: white;
    border-radius: 50%;

    box-shadow: 0 0 10px white;
}

/* Star positions */
.star1 {
    top: 80px;
    left: 250px;
}

.star2 {
    top: 150px;
    left: 100px;
}

.star3 {
    top: 350px;
    left: 80px;
}

.star4 {
    top: 420px;
    left: 280px;
}

.star5 {
    top: 100px;
    left: 400px;
}

.star6 {
    top: 300px;
    left: 420px;
}

.star7 {
    top: 390px;
    left: 380px;
}

.star8 {
    top: 220px;
    left: 60px;
}

/* Galaxy rotation */
@keyframes rotateGalaxy {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}
    </style>

<body>

    <div class="galaxy">

        <div class="star star1"></div>
        <div class="star star2"></div>
        <div class="star star3"></div>
        <div class="star star4"></div>
        <div class="star star5"></div>
        <div class="star star6"></div>
        <div class="star star7"></div>
        <div class="star star8"></div>

        <div class="core"></div>

    </div>

</body>
</html>
