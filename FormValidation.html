<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="post" name="Form1" onsubmit="return validateForm()">
        Username: <input type="text" name="username" id="username"><br>
        Description: <textarea cols="30" rows="2" name="description" id="description"></textarea><br>
        Password: <input type="password" name="pwd1" id="pwd1"><br>
        Retype password:<input type="password"  name="pwd2" id="pwd2"><br>
        <button type="submit" name="submit">SUBMIT</button>
    </form>

    <script>
        function validateForm() {
            var uname = document.getElementById("username").value;
            var desc = document.getElementById("description").value;
            var p1 = document.getElementById("pwd1").value;
            var p2 = document.getElementById("pwd2").value;

            if(uname == '' || desc == '' || p1 == '' || p2 == ''){
                alert("Please fill all required fields!");
                return false;
            }
            else{
                if(p1 != p2){
                    alert("Password & Retype-passwords must be same!");
                    return false;
                }
            }
        }
    </script>

</body>
</html>
