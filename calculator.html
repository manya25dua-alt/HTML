<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .calculator {
            width: 380px;
            padding: 20px;
            background: #000;
        }

        #display {
            width: 100%;
            height: 130px;
            background: #000;
            border: none;
            outline: none;
            color: white;
            font-size: 60px;
            text-align: right;
            padding: 20px 10px;
            margin-bottom: 15px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            width: 78px;
            height: 78px;
            border: none;
            border-radius: 50%;
            background: #333;
            color: white;
            font-size: 30px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.1s;
        }

        button:hover {
            filter: brightness(1.3);
        }

        button:active {
            transform: scale(0.93);
        }

        .function {
            background: #636363;
            color: white;
            font-size: 25px;
        }

        .operator {
            background: #ff9500;
            color: white;
            font-size: 35px;
        }

        /* Mobile */
        @media (max-width: 450px) {
            .calculator {
                width: 100%;
                padding: 15px;
            }
            button {
                width: 70px;
                height: 70px;
            }
            #display {
                font-size: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="calculator">

        <input type="text" id="display" value="0" readonly>

        <div class="buttons">

            <button class="function" onclick="backspace()">⌫</button>
            <button class="function" onclick="clearDisplay()">AC</button>
            <button class="function" onclick="percentage()">%</button>
            <button class="operator" onclick="press('/')">÷</button>

            <button onclick="press('7')">7</button>
            <button onclick="press('8')">8</button>
            <button onclick="press('9')">9</button>
            <button class="operator" onclick="press('*')">×</button>

            <button onclick="press('4')">4</button>
            <button onclick="press('5')">5</button>
            <button onclick="press('6')">6</button>
            <button class="operator" onclick="press('-')">−</button>

            <button onclick="press('1')">1</button>
            <button onclick="press('2')">2</button>
            <button onclick="press('3')">3</button>
            <button class="operator" onclick="press('+')">+</button>

            <button onclick="toggleSign()">+/−</button>
            <button onclick="press('0')">0</button>
            <button onclick="press('.')">.</button>
            <button class="operator" onclick="calculate()">=</button>

        </div>
    </div>


    <script>
        let display = document.getElementById("display");
        let expression = "";
        function press(value) {

            if (expression === "0") {
                expression = "";
            }
            expression += value;
            display.value = expression;
        }
        function clearDisplay() {
            expression = "";
            display.value = "0";
        }
        function backspace() {
            expression = expression.slice(0, -1);
            if (expression === "") {
                display.value = "0";
            }
            else {
                display.value = expression;
            }
        }
        function percentage() {
            try {
                expression = eval(expression + "/100").toString();
                display.value = expression;
            }
            catch (error) {
                display.value = "Error";
                expression = "";
            }
        }
        function toggleSign() {
            if (expression === "") {
                return;
            }
            if (expression.startsWith("-")) {
                expression = expression.substring(1);
            }
            else {
                expression = "-" + expression;
            }
            display.value = expression;
        }
        function calculate() {
            try {
                let result = eval(expression);
                display.value = result;
                expression = result.toString();
            }
            catch (error) {
                display.value = "Error";
                expression = "";
            }
        }
    </script>
</body>
</html>
