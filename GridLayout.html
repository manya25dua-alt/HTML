<html>
    <head>
        <style>
            *{
                margin : 0px;
                padding: 0px;
            }

            .container{
                display : grid;
                width: 100vw;
                height : 100vh;
                grid-template-columns: 100%;
                grid-template-rows: 30% 70%;
            }

            .header {
                background-color : gray;
                grid-column-start: 1;
                grid-column-end: 2;
                grid-row-start: 1;
                grid-row-end: 2;
            }

            .main{
                background-color: maroon;
                grid-column-start: 1;
                grid-column-end: 2;
                grid-row-start: 2;
                grid-row-end: 3;
            }

        </style>
    </head>
    <body>
        <div class = "container">
            <div class = "header">Header</div>
            <div class = "main">Main</div>
        </div>
    </body>
</html>
